name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID || '' }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID || '' }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY || '' }}
        run: |
          echo "🔍 Checking environment variables..."
          echo "VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:+✅ Set (length: ${#VITE_SUPABASE_URL})}${VITE_SUPABASE_URL:-❌ Missing}"
          echo "VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:+✅ Set (length: ${#VITE_SUPABASE_ANON_KEY})}${VITE_SUPABASE_ANON_KEY:-❌ Missing}"
          
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo ""
            echo "❌ ERROR: Required secrets are missing!"
            echo ""
            echo "Please add these secrets in GitHub:"
            echo "  Settings → Secrets and variables → Actions → New repository secret"
            echo ""
            echo "Required secrets:"
            echo "  - VITE_SUPABASE_URL"
            echo "  - VITE_SUPABASE_ANON_KEY"
            echo ""
            exit 1
          fi
          
          echo "✅ Environment variables verified"
          echo "🚀 Starting build..."
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Verify build output
        run: |
          if [ ! -d "./dist" ]; then
            echo "❌ ERROR: Build failed - dist folder not found!"
            exit 1
          fi
          echo "✅ Build output verified"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

